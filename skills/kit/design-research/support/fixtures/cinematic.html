<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Maison Nuit — architecture</title><meta name="description" content="A dark, slow, cinematic studio.">
<style>
:root { --ink:#0b0b0e; --paper:#eae6dd; --accent:#c9a46a; }
html,body{margin:0;background:var(--ink);color:var(--paper);cursor:none;font-family:"Playfair Display",Georgia,serif}
section{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative}
h1{font-size:12vw;line-height:.9;margin:0;font-weight:400;text-transform:uppercase;letter-spacing:-.02em;transition:letter-spacing 1200ms cubic-bezier(.2,.8,.2,1)}
h1:hover{letter-spacing:.04em}
p{font:16px/1.5 Inter,Helvetica,Arial,sans-serif;max-width:32ch;opacity:.8}
.orb{position:absolute;right:10%;top:20%;width:120px;height:120px;border-radius:50%;background:var(--accent);animation:float 6s ease-in-out infinite}
.orb2{position:absolute;left:8%;bottom:15%;width:80px;height:80px;background:#334;animation:float 9s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}
.reveal{opacity:0;transform:translateY(40px);transition:opacity 1200ms,transform 1200ms}.reveal.in{opacity:1;transform:none}
a.btn{color:var(--paper);border:1px solid var(--paper);padding:14px 22px;transition:background 400ms,color 400ms}a.btn:hover{background:var(--paper);color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
</style>
<script>window.gsap={version:'3.12'};window.ScrollTrigger={};window.Lenis=function(){};</script></head>
<body><canvas id="gl" width="300" height="150"></canvas>
<section><h1>Maison<br>Nuit</h1><div class="orb"></div><div class="orb2"></div></section>
<section><div class="reveal"><p>We build houses that listen to light.</p><a class="btn" href="#a">Projects</a></div></section>
<section><div class="reveal"><p>Second chapter.</p></div></section>
<section><div class="reveal"><p>Third chapter.</p><a class="btn" href="#b">Contact</a></div></section>
<script>
const gl=document.getElementById('gl').getContext('webgl');
const io=new IntersectionObserver((es)=>es.forEach(e=>e.isIntersecting&&e.target.classList.add('in')));document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
let n=0;(function loop(){if(n++<400)requestAnimationFrame(loop)})();
</script></body></html>
