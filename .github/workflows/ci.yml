name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build:web
  brain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Brain tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          if [ -d brain/tests ]; then python3 -m unittest discover -s brain/tests; else echo "no brain yet"; fi
