 // Q1: « L'IA accélère votre travail ? » (speed, then nothing)

 // Q2: « Et si vos objectifs étaient alignés ? » (scattered points that snap into a line)
 else if(t<Hk.q3[0]-.1){const u=t-Hk.q2[0],out=ramp(t,Hk.q3[0]-.25,Hk.q3[0]-.1);

   const x=rx+(tx-rx)*snap+wob,y=ry+(ty-ry)*snap+Math.cos(t*(1.2+rnd(i+7))+i)*24*(1-snap),s=14+rnd(i+3)*18*(1-snap)+8*snap;
