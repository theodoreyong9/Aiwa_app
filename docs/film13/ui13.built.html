 // Q1: « L'IA accélère votre travail ? » (speed, then nothing)
 if(t<Hk.q2[0]-.1){const u=t-Hk.q1[0],a=ramp(t,Hk.q1[0]-.05,Hk.q1[0]+.1),out=ramp(t,Hk.q2[0]-.25,Hk.q2[0]-.1);

 // Q2: « Et si vos objectifs étaient alignés ? » (scattered points that snap into a line)
 else if(t<Hk.q3[0]-.1){const u=t-Hk.q2[0],out=ramp(t,Hk.q3[0]-.25,Hk.q3[0]-.1);

 const FR=d.querySelector('.frame');if(FR){const p=eo(clamp((k-.0)/.6));FR.style.transform=`scale(${1+.0*p})`;const lab=FR.querySelector('div');if(lab&&k>.15){lab.style.background='radial-gradient(70% 90% at 30% 40%,#c48a1f,transparent 70%),radial-gradient(60% 80% at 75% 65%,#e5605b,transparent 70%),#1a0c0c';lab.lastElementChild.innerHTML='Présentation · 0:45'}}
 const cells=d.querySelectorAll('.dock .cell');const NEW=[['Mon CV','en PDF'],['Prendre rendez-vous','30 min · visio'],['Mes projets','Aiwa, Jobber']];cells.forEach((c,i)=>{if(k>.4+i*.15&&NEW[i]){c.querySelector('b').textContent=NEW[i][0];c.querySelector('span').textContent=NEW[i][1]}})}
function beat2(t){const B=BT[0];let bg=aurora(t,.8,0),h='';

 h+=lab(PX[0],'UN AMI',PAL.blue,0)+lab(PX[1],'UN RECRUTEUR',PAL.gold,on);
