<!doctype html><html><head><meta charset="utf-8"><title>phone screen</title>
<style>
@font-face{font-family:SG;src:url(../aiwa-v25/fonts/SpaceGrotesk.ttf);font-weight:300 700}
html,body{margin:0;background:#0e0c0d;width:720px;height:1600px;overflow:hidden}
canvas{display:block}
</style></head><body><canvas id="c" width="720" height="1600"></canvas>
<script>
// The screen of the phone, frame by frame. The picture of the desktop is the real one (a screenshot of the author's phone, passed as ?img=path: it is not in the repository);
// the lock screen is built from it (the same wallpaper, no widget, no icons), the widget is cut into its pieces so that its buttons can move.
const Q=new URLSearchParams(location.search),IMG=Q.get('img')||'/tmp/os3/src/home.jpg';
const TL=__TIMELINE__,T=TL.T;
const c=document.getElementById('c'),g=c.getContext('2d');
const BG='#0e0c0d';
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),ramp=(t,a,b)=>clamp((t-a)/(b-a)),eo=x=>1-Math.pow(1-x,3),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,sm=x=>x*x*(3-2*x);
const img=new Image();img.src=IMG;
// the pieces of the widget, in the screenshot's own pixels: a polygon, a centre, a kind of press
const P={
 t1:{poly:[[96,1040],[232,1040],[222,1090],[82,1090]]},
 t2:{poly:[[232,1040],[372,1040],[362,1090],[222,1090]]},
 t3:{poly:[[372,1040],[512,1040],[501,1090],[362,1090]]},
 t4:{poly:[[515,1026],[626,1026],[639,1090],[502,1090]]},
 cache:{poly:[[35,1090],[378,1090],[362,1183],[35,1183]],round:[14,0,0,14]},
 prox:{poly:[[378,1090],[686,1090],[686,1183],[362,1183]],round:[0,14,14,0]},
 b1:{poly:[[82,1183],[275,1183],[268,1230],[122,1230]]},
 b2:{poly:[[275,1183],[462,1183],[455,1229],[268,1229]]},
 b3:{poly:[[462,1183],[640,1183],[640,1210],[600,1230],[455,1229]]}};
for(const k in P){const xs=P[k].poly.map(p=>p[0]),ys=P[k].poly.map(p=>p[1]);P[k].cx=(Math.min(...xs)+Math.max(...xs))/2;P[k].cy=(Math.min(...ys)+Math.max(...ys))/2}
function poly(k,grow=0){const p=P[k].poly;g.beginPath();p.forEach((q,i)=>{const dx=q[0]-P[k].cx,dy=q[1]-P[k].cy,l=Math.hypot(dx,dy)||1;const x=q[0]+dx/l*grow,y=q[1]+dy/l*grow;i?g.lineTo(x,y):g.moveTo(x,y)});g.closePath()}
// a tap: a pulse of 0..1..0 over .5 s
const pulse=(t,a,d=.55)=>{const u=ramp(t,a,a+d);return u<=0||u>=1?0:Math.sin(Math.PI*Math.pow(u,.8))};
function state(t){ // what each piece does
 const s={};for(const k in P)s[k]={dx:0,dy:0,sc:1,fl:0,dim:0};
 const TT=T.tapTimes,sel=sm(ramp(t,TT[0]-.05,TT[0]+.35));                       // the selected tab goes from the eye to the </>
 s.t3.dy=-13*sel;s.t3.fl=.35*sel;s.t4.dy=13*sel;s.t4.dim=.45*sel;
 const pr=pulse(t,TT[1]),ca=pulse(t,TT[2]),st=pulse(t,TT[3]);
 s.prox.sc=1-.05*pr;s.prox.fl=.55*pr;s.cache.sc=1-.05*ca;s.cache.fl=.5*ca;s.b3.dy=5*st;s.b3.fl=.5*st;
 return s}
function drawBase(){g.drawImage(img,0,0)}
function drawPieces(t,alpha=1){
 const s=state(t);
 for(const k in P){const o=s[k];if(!o.dx&&!o.dy&&o.sc===1&&!o.fl&&!o.dim)continue;
  g.save();poly(k,1.5);g.fillStyle=BG;g.fill();g.restore();                                // the hole it leaves
 }
 for(const k in P){const o=s[k];if(!o.dx&&!o.dy&&o.sc===1&&!o.fl&&!o.dim)continue;
  g.save();g.translate(P[k].cx+o.dx,P[k].cy+o.dy);g.scale(o.sc,o.sc);g.translate(-P[k].cx,-P[k].cy);
  poly(k);g.clip();g.drawImage(img,0,0);
  if(o.fl){g.globalCompositeOperation='lighter';g.fillStyle=`rgba(170,130,255,${o.fl*.55})`;poly(k);g.fill()}
  if(o.dim){g.globalCompositeOperation='source-over';g.fillStyle=`rgba(14,12,13,${o.dim})`;poly(k);g.fill()}
  g.restore()}
 // ripples where the finger lands
 const rip=(a,x,y)=>{const u=ramp(t,a,a+.7);if(u>0&&u<1){g.save();g.strokeStyle=`rgba(210,190,255,${.7*(1-u)})`;g.lineWidth=3;g.beginPath();g.arc(x,y,12+u*70,0,7);g.stroke();g.restore()}};
 rip(T.tapTimes[0]-.05,P.t3.cx,P.t3.cy);rip(T.tapTimes[1],P.prox.cx+60,P.prox.cy);rip(T.tapTimes[2],P.cache.cx,P.cache.cy);rip(T.tapTimes[3],P.b3.cx,P.b3.cy);
}
function drawLock(t,a){
 g.save();g.globalAlpha=a;g.fillStyle=BG;g.fillRect(0,0,720,1600);
 g.drawImage(img,0,60,720,770,0,60,720,770);                                              // the wallpaper (the art), nothing else
 g.fillStyle=BG;g.fillRect(0,830,720,300);
 g.restore();
}
function lockText(t,a){
 g.save();g.globalAlpha=a;g.textAlign='center';g.fillStyle='#fff';g.shadowColor='#0008';g.shadowBlur=18;
 g.font='300 150px SG';g.fillText('08:55',360,200);g.font='400 32px SG';g.fillStyle='#ffffffcc';g.fillText('lundi 26 octobre',360,252);
 g.font='400 26px SG';g.fillStyle='#ffffff90';g.fillText('Glisser vers le haut pour déverrouiller',360,1500);
 g.restore()}
function statusBar(a){g.save();g.globalAlpha=a;g.fillStyle=BG;g.fillRect(0,0,720,62);g.drawImage(img,0,0,720,62,0,0,720,62);g.restore()}
function wave(t){ // "j'écoute": the voice, as bars over the dark band under the status bar
 const on=ramp(t,T.unlock,T.unlock+.4)*(1-ramp(t,T.unlock+2.6,T.unlock+3.3));if(on<=0)return;
 g.save();g.globalAlpha=on;const n=44;
 for(let i=0;i<n;i++){const a=(Math.sin(i*.7+t*9)*.5+Math.sin(i*1.3-t*6)*.5)*.5+.5,h=10+a*92*Math.sin(i/(n-1)*Math.PI),x=90+i*13.2;
  const gr=g.createLinearGradient(0,95-h/2,0,95+h/2);gr.addColorStop(0,'#57e0ff');gr.addColorStop(1,'#b48cff');g.fillStyle=gr;g.shadowColor='#7fb0ff';g.shadowBlur=16;
  g.beginPath();g.roundRect(x,95-h/2,7,h,3.5);g.fill()}
 g.restore()}
window.render=async function(t){
 await window.READY;
 g.clearRect(0,0,720,1600);g.fillStyle=BG;g.fillRect(0,0,720,1600);
 const off=1-ramp(t,T.screenOff,T.screenOff+.22),on=ramp(t,T.screenOn,T.screenOn+.5);
 const bright=t<T.screenOff?1:(t<T.screenOn?off*(t<T.screenOff+.22?1:0):on);       // the screen goes dark, then comes back
 const unlock=ramp(t,T.unlock-.1,T.unlock+.5);
 if(t<T.reveal[0]){g.fillStyle='#000';g.fillRect(0,0,720,1600);return}
 const appear=ramp(t,T.reveal[0],T.reveal[1]);
 if(unlock<1){drawLock(t,1);statusBar(1);g.save();g.translate(0,-unlock*140);lockText(t,1-unlock);g.restore()}
 if(unlock>0){g.save();g.globalAlpha=sm(unlock);g.translate(0,(1-unlock)*60);drawBase();g.restore();if(unlock>=1){drawPieces(t)}}
 wave(t);
 // the screen lights, and a pulse of light when it comes back
 g.save();g.globalAlpha=1-Math.min(1,appear);g.fillStyle='#000';g.fillRect(0,0,720,1600);g.restore();
 g.save();g.globalAlpha=1-bright;g.fillStyle='#000';g.fillRect(0,0,720,1600);g.restore();
};
window.READY=Promise.all([new Promise(r=>{img.onload=()=>r(true);if(img.complete&&img.naturalWidth)r(true)}),document.fonts.load('300 150px SG'),document.fonts.load('400 32px SG')]);
</script></body></html>
