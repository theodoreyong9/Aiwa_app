<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Aiwa film 10 — the screens</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#05060f}
body{font-family:Inter,'Inter Display',sans-serif;color:#f2f4ff;position:relative;-webkit-font-smoothing:antialiased}
#root{position:absolute;left:0;top:0;transform-origin:0 0}
.mono{font-family:'DejaVu Sans Mono',monospace}
.abs{position:absolute}
.cell{position:absolute;display:flex;align-items:center;justify-content:center;gap:14px;font-weight:650;color:#fff;clip-path:polygon(var(--s) 0,100% 0,calc(100% - var(--s)) 100%,0 100%);box-shadow:inset 0 0 0 2px #ffffff40}
.cell svg{width:var(--ic);height:var(--ic);fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{position:absolute;border-radius:28px;background:linear-gradient(180deg,#ffffff16,#ffffff08);border:2px solid #ffffff22;box-shadow:0 20px 60px #0008}
.page{position:absolute;background:#fbfbf8;color:#1b1d27;border-radius:10px;box-shadow:0 30px 90px #000a;overflow:hidden}
.bar{position:absolute;border-radius:99px;background:#ffffff1f;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.chip{position:absolute;border-radius:99px;padding:0 26px;display:flex;align-items:center;font-weight:600;white-space:nowrap}
</style></head><body>
<div id="root"></div>
<script>
const Q=new URLSearchParams(location.search),MODE=Q.get('m')||'tv0';
const TL=__TIMELINE__,V=TL.voice,D=__DURATIONS__;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ramp=(t,a,b)=>clamp((t-a)/(b-a)),eo=x=>1-Math.pow(1-x,3),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,mix=(a,b,k)=>a+(b-a)*k;
const $=id=>document.getElementById(id);
const rnd=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const typed=(s,t,a,b)=>s.slice(0,Math.round(s.length*clamp((t-a)/(b-a))));
const IC={doc:'M7 3h7l5 5v13H7z M14 3v5h5 M9.5 13h6 M9.5 17h6',target:'M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18z M12 8a4 4 0 1 0 0 8a4 4 0 0 0 0-8z M12 11.2a.8.8 0 1 0 0 1.6a.8.8 0 0 0 0-1.6',mail:'M3 6h18v12H3z M3 7l9 6.5L21 7',clip:'M16.5 8.5l-7 7a2.5 2.5 0 0 1-3.5-3.5l8-8a4 4 0 0 1 5.7 5.7l-8.2 8.2',shield:'M12 3l8 3v6c0 5-3.4 8-8 9c-4.6-1-8-4-8-9V6z M8.5 12l2.5 2.5L16 9.5',heart:'M12 20s-7-4.6-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.4-7 10-7 10z',star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',search:'M11 4a7 7 0 1 0 0 14a7 7 0 0 0 0-14z M16.5 16.5L21 21',jump:'M7 17L17 7 M9 7h8v8',widget:'M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M13 13h7v7h-7z',mic:'M12 3a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z M6 11a6 6 0 0 0 12 0 M12 17v4',check:'M5 12.5l4.5 4.5L19 7.5',door:'M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16 M4 21h16 M14.5 12.5v.5',cast:'M3 8V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5 M3 12a8 8 0 0 1 8 8 M3 16a4 4 0 0 1 4 4 M3 20h.01',list:'M8 6h12 M8 12h12 M8 18h12 M4 6h.01 M4 12h.01 M4 18h.01',chart:'M4 20V10 M10 20V4 M16 20v-8 M22 20H2',scenario:'M5 5h14v14H5z M9 9l6 3-6 3z',send:'M3 11l18-8-8 18-2-8z'};
const svg=n=>`<svg viewBox="0 0 24 24"><path d="${IC[n]||''}"/></svg>`;
const TONE={blue:['#6b9bf5','#2f5db8'],green:['#3fa37e','#22664a'],orange:['#e09a7c','#b5603f'],violet:['#a77bd6','#6f4a9e'],grey:['#ffffff','#ffffff'],red:['#e5605b','#a8302d'],yellow:['#e8c14a','#a9831c'],teal:['#34d6b0','#12806a']};
function cell(x,y,w,h,tone,icon,label,o={}){const t=TONE[tone]||TONE.grey,a=tone==='grey'?['#ffffff3a','#ffffff14']:[t[0]+'d0',t[1]+'a0'];const s=o.skew??h*.2,ic=o.ic??h*.42;
 const press=o.press?`transform:scale(${1-.05*o.press});filter:brightness(${1+.4*o.press});`:'';
 return `<div class="cell" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;--s:${s}px;--ic:${ic}px;background:linear-gradient(180deg,${a[0]},${a[1]});font-size:${o.fs||h*.3}px;opacity:${o.op??1};${press}${o.style||''}">${icon?svg(icon):''}${label?`<span>${label}</span>`:''}</div>`}
const wave=(x,y,w,h,t,amp=1,n=44,col='#9db8ff')=>{let s='';if(amp<.03)return s;for(let i=0;i<n;i++){const k=(i/(n-1)),env=Math.sin(Math.PI*k),v=Math.abs(Math.sin(t*7+i*.7)*.6+Math.sin(t*11.3+i*1.3)*.4)*env*amp;const bh=Math.max(4,h*v);s+=`<div class="abs" style="left:${x+i*(w/n)}px;top:${y+(h-bh)/2}px;width:${w/n*.55}px;height:${bh}px;border-radius:9px;background:${col}"></div>`}return s};
const wall=(W,H,hue=0)=>`<div class="abs" style="inset:0;background:radial-gradient(${W*.9}px ${H*.8}px at 18% 10%,#26358a,transparent 62%),radial-gradient(${W*.8}px ${H*.7}px at 92% 96%,#5a2a86,transparent 60%),radial-gradient(${W*.5}px ${H*.5}px at 62% 44%,#0d6a6a44,transparent 60%),#070a1e"></div>`;
const status=(W,t0='08:55')=>`<div class="abs" style="left:46px;top:30px;font-size:34px;font-weight:600">${t0}</div><div class="abs" style="right:46px;top:34px;font-size:28px;color:#cfd3ff">5G &nbsp; 90 %</div>`;

// ---------------------------------------------------------------------------------------------------------------- the documents
const FIRMS=['Maison Lumen','Atelier Nord','Studio Kōri','Vector & Fils','Nova Lab','Orbital','Palette','Quartz Média','Fabrique Verte','Helio','Mosaïque','Cerf-Volant'];
const HOOK=['votre manière de relier le design et le code','votre travail sur les outils créatifs','la place que vous donnez aux petites équipes','vos produits pensés pour la voix','votre exigence sur le détail','votre lecture ouverte des données','votre goût pour les ateliers courts','votre approche éditoriale du produit','votre engagement sur l’impact','votre manière de lancer vite et bien','votre catalogue vivant','votre ton direct et chaleureux'];
function docPage(i,x,y,w,h,o={}){const f=FIRMS[i%12],s=w/760;
 const ln=(wd,hh=14,c='#c9ccd8')=>`<div style="height:${hh*s}px;width:${wd}%;background:${c};border-radius:${6*s}px;margin-bottom:${13*s}px"></div>`;
 return `<div class="page" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;${o.style||''}"><div style="position:absolute;inset:0;padding:${52*s}px ${56*s}px">
  <div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div style="font-size:${34*s}px;font-weight:700;letter-spacing:-.02em">Léa Dupont</div><div style="font-size:${17*s}px;color:#5a5f78;margin-top:${6*s}px">Cheffe de produit · design &amp; code</div></div>
   <div style="text-align:right;font-size:${14*s}px;color:#6a6f88;line-height:1.5">lea@exemple.fr<br>06 00 00 00 00<br>Lyon</div></div>
  <div style="height:${3*s}px;background:linear-gradient(90deg,#6a5cff,#1ac8a0);margin:${26*s}px 0 ${30*s}px"></div>
  <div style="font-size:${21*s}px;font-weight:650;margin-bottom:${8*s}px">Candidature — ${f}</div>
  <div style="font-size:${15*s}px;color:#6a6f88;margin-bottom:${26*s}px">Objet : poste de cheffe de produit</div>
  <div style="font-size:${16*s}px;line-height:1.55;color:#2a2d3c;margin-bottom:${18*s}px">Madame, Monsieur,<br><br>J’ai lu avec attention ${HOOK[i%12]}, et j’aimerais vous montrer comment mon parcours peut y répondre.</div>
  ${ln(100)}${ln(96)}${ln(100)}${ln(62)}<div style="height:${14*s}px"></div>${ln(100)}${ln(92)}${ln(100)}${ln(88)}${ln(40)}
  <div style="position:absolute;left:${56*s}px;right:${56*s}px;bottom:${46*s}px;display:flex;justify-content:space-between;align-items:center"><div style="font-size:${15*s}px;color:#6a6f88">Cordialement, Léa Dupont</div>
   <div style="display:flex;align-items:center;gap:${8*s}px;font-size:${13*s}px;color:#3a3fa0;background:#e7e9ff;border-radius:99px;padding:${7*s}px ${14*s}px"><span style="width:${9*s}px;height:${9*s}px;border-radius:50%;background:#34d6b0"></span>profil lié · aiwa/lea</div></div>
 </div></div>`}

// ---------------------------------------------------------------------------------------------------------------- the television (the agent)
function tv0(t){const W=1920,H=1080;let h=wall(W,H);
 const sp=t-TL.TV0.splash[0],pr=ramp(t,TL.TV0.splash[0],TL.TV0.splash[0]+.7);
 if(t<TL.TV0.splash[0]+3.3){ // the first sight of the television: Aiwa takes the screen, the phone icon and a cast ripple
  const k=eo(ramp(sp,0,.9));
  h+=`<div class="abs" style="left:${W/2-130}px;top:${H/2-200}px;width:260px;height:260px;border-radius:70px;background:radial-gradient(circle at 38% 32%,#f7e27a,#f2b705 55%,#6a5200);box-shadow:0 0 ${120*k}px #f2b70599;transform:scale(${.6+.4*k});opacity:${k};display:flex;align-items:center;justify-content:center;font-size:150px;font-weight:700;color:#2a2000">A</div>`;
  for(let r=0;r<3;r++){const q=((sp*.55+r/3)%1);h+=`<div class="abs" style="left:${W/2-130-q*360}px;top:${H/2-200-q*360}px;width:${260+q*720}px;height:${260+q*720}px;border-radius:${70+q*360}px;border:3px solid #f2b705;opacity:${(1-q)*.6*k}"></div>`}
  h+=`<div class="abs" style="left:0;right:0;top:${H/2+100}px;text-align:center;font-size:62px;font-weight:600;letter-spacing:-.02em;opacity:${k}">Aiwa est sur la télé</div><div class="abs mono" style="left:0;right:0;top:${H/2+190}px;text-align:center;font-size:26px;letter-spacing:.3em;color:#9db8ff;opacity:${k}">LE TÉLÉPHONE RESTE ÉTEINT</div>`;
 }
 const a=TL.TV0.splash[0]+3.3; // the agent screen
 const lab=ramp(t,a,a+.6);
 if(t>=a){
  h=wall(W,H);
  h+=`<div class="abs" style="left:70px;top:48px;font-size:34px;font-weight:650;opacity:${lab}">Aiwa</div><div class="abs mono" style="right:70px;top:56px;font-size:24px;color:#9db8ff;letter-spacing:.2em;opacity:${lab}">SUPER AGENT · SUR LA TÉLÉ</div>`;
  // the transcript: what is said, as it is said
  const order="Prends mon CV, et fais une campagne de candidature : un document par cible, en liant mon profil. Montre-les-moi quand c'est fait.";
  const t0=TL.voice.order,t1=t0+D.order,ack0=TL.voice.ack;
  const listen=ramp(t,a,a+.5)*(1-ramp(t,t1+.1,t1+.5));
  h+=wave(560,300,800,170,t,listen*(t>t0?1:.35),56,'#9db8ff');
  h+=`<div class="abs" style="left:300px;right:300px;top:560px;text-align:center;font-size:54px;line-height:1.28;font-weight:550;letter-spacing:-.015em;opacity:${ramp(t,t0-.1,t0+.4)*(1-ramp(t,ack0+.3,ack0+.9))}">${typed(order,t,t0,t1-.3)}<span style="opacity:${t<t1?(Math.sin(t*14)>0?1:0):0};color:#9db8ff">▍</span></div>`;
  h+=`<div class="abs" style="left:0;right:0;top:420px;text-align:center;font-size:40px;color:#cfd8ff;opacity:${ramp(t,a+.3,a+.9)*(1-ramp(t,t0-.1,t0+.3))}">J’écoute<span style="color:#34d6b0">.</span></div>`;
  // the work: the CV, the profile, the targets, twelve documents appear
  const w0=TL.TV0.work[0],w1=TL.TV0.work[1],wk=ramp(t,w0,w0+.6),pg=clamp((t-w0-.6)/(w1-w0-1.0));
  if(t>=ack0){
   h+=`<div class="abs" style="left:0;right:0;top:110px;text-align:center;font-size:44px;font-weight:600;opacity:${wk*(1-ramp(t,TL.TV0.ready+1.0,TL.TV0.ready+1.4))}">Campagne de candidature</div>`;
   h+=`<div class="card" style="left:120px;top:190px;width:380px;height:210px;opacity:${wk};transform:translateY(${(1-eo(wk))*40}px)"><div class="abs" style="left:34px;top:30px;width:70px;height:88px">${docPage(0,0,0,70,88,{style:'border-radius:6px'})}</div><div class="abs" style="left:130px;top:34px;font-size:30px;font-weight:650">CV_Léa_Dupont.pdf</div><div class="abs mono" style="left:130px;top:82px;font-size:20px;color:#9db8ff">lu · 2 pages</div><div class="abs" style="left:34px;top:146px;right:34px;font-size:22px;color:#7ae0c0">${svg('check').replace('<svg','<svg style="width:22px;height:22px;stroke:#7ae0c0;vertical-align:-3px"')} profil lié</div></div>`;
   h+=`<div class="card" style="left:120px;top:430px;width:380px;height:210px;opacity:${ramp(t,w0+.5,w0+1.1)}"><div class="abs" style="left:34px;top:26px;font-size:30px;font-weight:650">12 cibles</div>${FIRMS.slice(0,5).map((f,i)=>`<div class="abs" style="left:34px;top:${72+i*26}px;font-size:21px;color:#cfd8ff;opacity:${ramp(t,w0+.8+i*.15,w0+1.1+i*.15)}">${f}</div>`).join('')}</div>`;
   const n=Math.floor(pg*12+.0001);
   for(let i=0;i<12;i++){const col=i%4,row=Math.floor(i/4),show=eo(ramp(pg*12,i,i+.9)),X=700+col*270,Y=210+row*250;
    h+=`<div class="abs" style="left:${X}px;top:${Y}px;width:236px;height:220px;opacity:${show};transform:translateY(${(1-show)*50}px) scale(${.92+.08*show})">${docPage(i,0,0,170,220,{style:'left:33px;border-radius:8px'})}<div class="abs" style="left:0;right:0;bottom:-30px;text-align:center;font-size:20px;color:#cfd8ff">${FIRMS[i]}</div></div>`}
   h+=`<div class="bar" style="left:700px;width:1050px;top:980px;height:14px;opacity:${wk}"><i style="width:${pg*100}%;background:linear-gradient(90deg,#8b7bff,#34d6b0)"></i></div><div class="abs mono" style="left:700px;top:940px;font-size:22px;color:#9db8ff;opacity:${wk}">${Math.min(12,n)} / 12 documents</div>`;
  }
  const rd=ramp(t,TL.TV0.ready,TL.TV0.ready+.5);
  if(rd>0&&t<TL.TV0.doc){h+=`<div class="abs" style="left:0;right:0;top:880px;text-align:center;font-size:56px;font-weight:650;color:#7ae0c0;opacity:${rd}">${svg('check').replace('<svg','<svg style="width:56px;height:56px;stroke:#7ae0c0;vertical-align:-8px"')} 12 documents prêts</div>`}
  // the first document opens
  if(t>=TL.TV0.doc-.6){const o=eo(ramp(t,TL.TV0.doc-.6,TL.TV0.doc+.6));h+=`<div class="abs" style="inset:0;background:#05060fcc;opacity:${o}"></div>`+docPage(0,mix(960-190,960-300,0),mix(60,40,o),600,1000,{style:`left:${660}px;opacity:${o};transform:translateY(${(1-o)*60}px)`})}
 }
 return h}

// ---------------------------------------------------------------------------------------------------------------- the phone of the desk (documents)
function p1(t){const W=1080,H=2400;let h=wall(W,H)+status(W);
 const L=TL.P1;
 const showDoc=t<L.list-.4, back=ramp(t,L.list-.4,L.list+.3);
 const open=ramp(t,L.open,L.open+.55),nxt=ramp(t,L.next,L.next+.5);
 // doc screen (the first document, the one the television showed)
 if(t<L.list+.4){h+=docPage(0,70,330,940,1420,{style:`opacity:${1-back};transform:translateX(${-back*140}px)`});h+=`<div class="abs" style="left:70px;top:200px;font-size:42px;font-weight:650;opacity:${1-back}">Maison Lumen</div>`}
 // the list
 if(t>=L.list-.4){
  const s=eo(back);
  h+=`<div class="abs" style="left:56px;top:150px;font-size:66px;font-weight:700;letter-spacing:-.025em;opacity:${s}">Mes documents</div><div class="abs mono" style="left:60px;top:240px;font-size:28px;letter-spacing:.2em;color:#9db8ff;opacity:${s}">12 · CAMPAGNE DE CANDIDATURE</div>`;
  for(let i=0;i<7;i++){const y=340+i*258,sel=(i===0?1:0),a=ramp(t,L.list+i*.06,L.list+.5+i*.06);
   h+=`<div class="card" style="left:56px;right:56px;top:${y}px;height:226px;opacity:${a*s};transform:translateX(${(1-eo(a))*90}px);${sel?'border-color:#8b7bffcc;background:linear-gradient(180deg,#8b7bff30,#8b7bff10)':''}"><div class="abs" style="left:34px;top:28px;width:130px;height:170px">${docPage(i,0,0,130,170,{style:'border-radius:6px'})}</div><div class="abs" style="left:200px;top:46px;font-size:46px;font-weight:650">${FIRMS[i]}</div><div class="abs" style="left:200px;top:118px;font-size:30px;color:#a8b3e8">Lettre · profil lié</div><div class="abs mono" style="left:200px;top:164px;font-size:24px;color:#6f7ab0">prêt · il y a 1 min</div></div>`}
  h+=`<div class="abs" style="left:0;right:0;bottom:130px;text-align:center;font-size:30px;color:#9db8ff;opacity:${s*(1-open)}">Dis « ouvre » · « suivant »</div>`;
 }
 // « ouvre »: the selected document opens; « suivant »: the next one
 if(t>=L.open){h+=`<div class="abs" style="inset:0;background:#05060fe6;opacity:${eo(open)}"></div>`;
   const x0=(1-eo(open))*1100,sl=eo(nxt);
   h+=docPage(0,70+x0-sl*1100,230,940,1420,{});h+=docPage(1,70+x0+(1-sl)*1100,230,940,1420,{});
   h+=`<div class="abs" style="left:70px;top:110px;font-size:44px;font-weight:650;opacity:${eo(open)}">${nxt>.5?FIRMS[1]:FIRMS[0]}</div><div class="abs mono" style="right:70px;top:122px;font-size:30px;color:#9db8ff;opacity:${eo(open)}">${nxt>.5?'2':'1'} / 12</div>`}
 // the listening mark when a word is said
 const hear=(a,d)=>ramp(t,a-.1,a)*(1-ramp(t,a+d,a+d+.3));
 const h1=Math.max(hear(V.open,D.open),hear(V.next,D.next));
 if(h1>0)h+=`<div class="abs" style="left:0;right:0;bottom:60px;display:flex;justify-content:center;opacity:${h1}"><div style="padding:18px 46px;border-radius:99px;background:#101640ee;border:2px solid #8b7bff88;font-size:44px;font-weight:600">${t<L.next-.3?'Ouvre':'Suivant'}<span style="color:#34d6b0">.</span></div></div>`;
 return h}

// ---------------------------------------------------------------------------------------------------------------- the phone taken from the console (targets, mail, attachment)
const BOTTOM=(a,press)=>`${[['doc','Documents','blue'],['target','Cibles','orange'],['mail','Mails','green'],['chart','Suivi','violet']].map((c,i)=>cell(46+i*252,2210,236,118,a===i?c[2]:'grey',c[0],c[1],{fs:28,ic:44,press:press===i?1:0})).join('')}`;
function p2(t){const W=1080,H=2400,L=TL.P2;let h=wall(W,H)+status(W);
 const tap=ramp(t,L.tapTargets,L.tapTargets+.12)*(1-ramp(t,L.tapTargets+.12,L.tapTargets+.35));
 const inTargets=t>=L.tapTargets&&t<L.mail, tList=ramp(t,L.list,L.list+.5);
 if(t<L.tapTargets+.2){ // home of the app: the documents just made
  h+=`<div class="abs" style="left:56px;top:150px;font-size:66px;font-weight:700;letter-spacing:-.025em">Aiwa</div><div class="abs mono" style="left:60px;top:240px;font-size:28px;letter-spacing:.2em;color:#9db8ff">12 DOCUMENTS · PRÊTS</div>`;
  for(let i=0;i<4;i++)h+=`<div class="card" style="left:56px;right:56px;top:${360+i*250}px;height:220px"><div class="abs" style="left:34px;top:26px;width:122px;height:168px">${docPage(i,0,0,122,168,{style:'border-radius:6px'})}</div><div class="abs" style="left:190px;top:44px;font-size:44px;font-weight:650">${FIRMS[i]}</div><div class="abs" style="left:190px;top:112px;font-size:30px;color:#a8b3e8">Lettre · profil lié</div></div>`;
  h+=BOTTOM(0,tap>0?1:-1);
 }
 if(inTargets){
  const s=eo(ramp(t,L.tapTargets+.12,L.tapTargets+.7)),tg=eo(ramp(t,L.openTarget,L.openTarget+.6));

 for(let i=0;i<60;i++){const z=((rnd(i)+t*.18)%1),x=cx+(rnd(i+5)-.5)*1200*z,y=cy+(rnd(i+9)-.5)*1600*z,sz=2+z*9;s+=`<div class="abs" style="left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;border-radius:50%;background:#e8e2ff;opacity:${(1-z)*.8*eo(ramp(t,P[0]+1,P[0]+2))}"></div>`}
 return s}
function p3(t){const W=1080,H=2400,L=TL.P3;
 let h=`<div class="abs" style="inset:0;background:#070a1e"></div>`;
 const imp=ramp(t,L.improve[0]+1.6,L.improve[1]-1.2),m=eo(ramp(t,L.tracker[0],L.tracker[1]));
 h+=profile(t,W,H,imp);
 h+=status(W);
 // the keys of the application become the follow-up of the campaign
 h+=keysBar(t,m)+tracker(t,m);
 // the voice is heard: a listening chip
 const hear=(a,d)=>ramp(t,a-.1,a)*(1-ramp(t,a+d,a+d+.3));
 const hv=Math.max(hear(V.improve,D.improve),hear(V.scenario,D.scenario),hear(V.chamber,D.chamber));
 if(hv>0)h+=`<div class="abs" style="left:56px;right:56px;top:300px;height:110px;border-radius:99px;background:#101640f0;border:2px solid #8b7bff88;opacity:${hv}">${wave(150,22,780,66,t,hv,36,'#9db8ff')}<div class="abs" style="left:34px;top:30px;width:50px;height:50px;border-radius:50%;background:#e5605b"></div></div>`;
 h+=scenarioCard(t,W,H);
 h+=deck(t,W,H);
 h+=chamber(t,W,H);
 h+=passage(t,W,H);
 return h}

// ---------------------------------------------------------------------------------------------------------------- the end card
function endcard(t){const W=1920,H=1080,a=eo(ramp(t,TL.end.card[0],TL.end.card[0]+1.2));
 return `<div class="abs" style="inset:0;background:radial-gradient(1400px 900px at 50% 55%,#1c1450,#04050d 70%)"></div><div class="abs" style="left:0;right:0;top:330px;text-align:center;font-size:96px;font-weight:650;letter-spacing:-.03em;opacity:${a};transform:translateY(${(1-a)*30}px)">Un univers,<br><span style="color:#b9a8ff">de multiples réalités.</span></div><div class="abs mono" style="left:0;right:0;top:760px;text-align:center;font-size:30px;letter-spacing:.5em;color:#9db8ff;opacity:${ramp(t,TL.end.card[0]+1.2,TL.end.card[0]+2)}">AIWA</div>`}
function titlecard(t){const W=1920,H=1080,a=eo(ramp(t,.3,1.2))*(1-ramp(t,TL.title[1]-.5,TL.title[1]));
 return `<div class="abs" style="inset:0;background:#02030a"></div><div class="abs" style="left:0;right:0;top:420px;text-align:center;font-size:70px;font-weight:600;letter-spacing:-.025em;opacity:${a};transform:translateY(${(1-a)*20}px)">${typed('Discover the next-gen vibecoding network.',t,.4,2.4)}</div>`}

const SIZES={tv0:[1920,1080],p1:[1080,2400],p2:[1080,2400],p3:[1080,2400],end:[1920,1080],title:[1920,1080]};
let inited=false;
window.render=async function(t){
 const [W,H]=SIZES[MODE];
 if(!inited){document.documentElement.style.width=W+'px';document.documentElement.style.height=H+'px';$('root').style.width=W+'px';$('root').style.height=H+'px';inited=true}
 const fn={tv0,p1,p2,p3,end:endcard,title:titlecard}[MODE];
 $('root').innerHTML=fn(t);
 await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));
};
