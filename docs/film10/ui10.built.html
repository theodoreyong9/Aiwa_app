 const sp=t-TL.TV0.splash[0],pr=ramp(t,TL.TV0.splash[0],TL.TV0.splash[0]+.7);

  h+=`<div class="abs" style="left:0;right:0;top:${H/2+100}px;text-align:center;font-size:62px;font-weight:600;letter-spacing:-.02em;opacity:${k}">Aiwa est sur la télé</div><div class="abs mono" style="left:0;right:0;top:${H/2+190}px;text-align:center;font-size:26px;letter-spacing:.3em;color:#9db8ff;opacity:${k}">LE TÉLÉPHONE RESTE ÉTEINT</div>`;
 }

  h+=`<div class="abs" style="left:70px;top:48px;font-size:34px;font-weight:650;opacity:${lab}">Aiwa</div><div class="abs mono" style="right:70px;top:56px;font-size:24px;color:#9db8ff;letter-spacing:.2em;opacity:${lab}">SUPER AGENT · SUR LA TÉLÉ</div>`;

  // the work: the CV, the profile, the targets, twelve documents appear
  const w0=TL.TV0.work[0],w1=TL.TV0.work[1],wk=ramp(t,w0,w0+.6),pg=clamp((t-w0-.6)/(w1-w0-1.0));
